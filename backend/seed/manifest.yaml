# 示例数据清单：模块、字段与初始记录的唯一来源。
#
# 进程启动时按本清单装载内存数据仓库；本地开发、构建镜像、部署都读这一份。
# 结构说明与装载顺序见 README「初始化数据」一节。
# 改完后先校验再启动：cd backend && .venv/bin/python -m app.seed_loader
# 环境之间只允许用 SEED_SCALE 调整数据量，结构不许分叉。

